[functions.fuse-ai]
# Authentication is enforced by auth.getUser(token) in the handler.
# Supports projects using asymmetric signing keys as well as legacy keys.
verify_jwt = false

[functions.organizer]
# POST verifies user JWTs or the dedicated recap scheduler secret; Supabase handles OAuth.
verify_jwt = false

[functions.admin-catalog]
# Handler independently verifies the user's JWT and admin membership.
verify_jwt = false

[functions.catalog-worker]
# Only the dedicated CATALOG_WORKER_SECRET is accepted by the handler.
verify_jwt = false
